services:
  api:
    build: .
    image: journal-ranking-api:latest
    ports:
      - "8000:8000"
    environment:
      JOURNAL_DB_PATH: /data/journals.sqlite3
    volumes:
      - journal-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  journal-data:
